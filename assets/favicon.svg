<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .border { stroke: rgba(0,0,0,0.1); stroke-width: 2; fill: none; }
      .text { fill: #0d1117; font-family: 'Bricolage Grotesque', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 32px; font-weight: 800; letter-spacing: -1.2px; }
      .dot { fill: #0f62fe; }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #0e1117; }
        .border { stroke: rgba(255,255,255,0.15); }
        .text { fill: #ffffff; }
        .dot { fill: #0f62fe; }
      }
    </style>
  </defs>
  <rect width="64" height="64" rx="16" class="bg"/>
  <rect width="64" height="64" rx="16" class="border"/>
  <text x="32" y="43" text-anchor="middle" class="text">Jay<tspan class="dot">.</tspan></text>
</svg>
